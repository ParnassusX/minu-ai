<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background with gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FBBF24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGrad)"/>
  
  <!-- Letter M -->
  <text x="100" y="115" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="72" font-weight="bold">M</text>
  
  <!-- Sparkle decorations -->
  <path d="M155 45 L160 50 L165 45 L160 40 Z" fill="url(#sparkleGrad)"/>
  <path d="M50 60 L53 63 L56 60 L53 57 Z" fill="url(#sparkleGrad)" transform="scale(0.8)"/>
  
  <!-- AI text -->
  <text x="100" y="165" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="Arial, sans-serif" font-size="20" font-weight="500">.AI</text>
</svg>
